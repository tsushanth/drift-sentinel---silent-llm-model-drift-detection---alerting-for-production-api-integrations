[project]
name = "drift-sentinel"
version = "0.1.0"
description = "Silent LLM model-drift detection & alerting for production API integrations."
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["openai>=1.0", "anthropic>=0.30"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drift_sentinel*"]
